services:
  db:
    image: postgres:15-alpine
    container_name: adminserver-db
    restart: always
    environment:
      POSTGRES_USER: pzuser
      POSTGRES_PASSWORD: pzpassword
      POSTGRES_DB: pzdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: adminserver-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
